function useWizardTracking(w,step){const id=useRef(sid());useEffect(()=>{track('wizard_start',{w,sid:id.current})},[]);useEffect(()=>{track('wizard_step',{w,step,sid:id.current})},[step]);return id.current}

/* ===== Quote math (single source of truth) ===== */
function quote(cfg,st){ // every line is tagged labor | parts | shipping so orders stay split for accounting and sales tax
 const m=cfg.models.find(x=>x.id===st.model);const L=[];if(m){const mat=Math.min(cfg.materials||0,m.price);L.push([m.name+' labor',m.price-mat,'labor']);if(mat)L.push(['Modchip + materials',mat,'parts'])}
 if(st.sd==='new'){const c=cfg.cards.find(c=>c.gb===st.gb);L.push([c?c.gb+'GB microSD, preconfigured':'New microSD (choose a size)',c?c.price:0,'parts'])}
 if(st.sd==='existing')L.push(['Setup of your microSD card',cfg.existingCardFee,'labor']);if(st.sd==='own')L.push(['Self-setup instructions',0,'labor']);
 L.push(['Return shipping (USPS, tracked)',cfg.returnShipping,'shipping']);
 const sum=c=>L.filter(x=>x[2]===c).reduce((a,b)=>a+(Number(b[1])||0),0);
 return{lines:L,total:L.reduce((a,b)=>a+(Number(b[1])||0),0),model:m,breakdown:{labor:sum('labor'),parts:sum('parts'),shipping:sum('shipping')}}}
const usable=(gb,res)=>{const f=Math.round(gb*0.93);return[Math.max(0,f-res[1]),Math.max(0,f-res[0])]};

 const rows=msg?[['First · to USPS','Ship your console to me','Example estimate, not a USPS quote','~'+money(lo)+'–'+money(hi),false],['After you see it done · to me','Service + return shipping',(cfg.business.paymentMethods||[]).join(' or ')+', after photos or video',money(q.total),true]]
  :[['Payment 1 · Today','Pay today via PayPal',"To Flippin' Isaac",money(q.total),true],['Payment 2 · After checkout','Shipping to us, paid to USPS','Example estimate, not a USPS quote','~'+money(lo)+'–'+money(hi),false]];
 return html`<div className="flex flex-col gap-2">${rows.map(([k,t,d,v,main])=>html`<div key=${k} className=${'rounded-xl p-3 flex justify-between items-center gap-3 '+(main?'border-2 border-acc bg-accsoft':'border-2 border-dashed border-line')}><div className="min-w-0"><p className=${'text-[11px] font-semibold uppercase tracking-[.1em] '+(main?'text-acc':'text-mute')}>${k}</p><p className="font-semibold leading-tight">${t}</p><p className="text-xs text-mute">${d}</p></div><p className=${'font-mono num whitespace-nowrap '+(main?'text-xl font-semibold':'text-mute')}>${v}</p></div>`)}
 <div className="flex justify-between items-baseline px-1 pt-1"><span className="font-semibold">Estimated total cost</span><span className="font-mono font-semibold num">${money(q.total+lo)}–${money(q.total+hi)}</span></div></div>`}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}}}

 const kpi=(l,v,s)=>html`<div className="rounded-2xl border border-line bg-card p-5"><p className="text-sm text-mute">${l}</p><p className="font-display text-4xl font-extrabold num mt-1">${v}</p>${s?html`<p className="text-xs text-mute mt-1">${s}</p>`:null}</div>`;
 return html`<div className="gut max-w-6xl mx-auto py-10 flex flex-col gap-10">
 <div className="flex flex-wrap items-end justify-between gap-4"><div><${Eyebrow}>Owner dashboard<//><h1 className="text-4xl font-extrabold">Business experiment</h1></div>
  <div className="flex rounded-full border border-line bg-card p-1" role="tablist">${[['example','Example data'],['local','This browser']].map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${mode===k} onClick=${()=>setMode(k)} className=${'rounded-full px-4 py-2 text-sm font-semibold '+(mode===k?'bg-acc text-accink':'text-mute')}>${l}</button>`)}</div></div>
 <${Note} warn><strong>Not connected.</strong> No analytics provider or form backend is set up, so no visitor data is being collected. ${mode==='example'?'Numbers below are made-up example data to preview the layout.':'Numbers below are only the clicks made in this browser.'}<//>
 <div className="grid gap-4 grid-cols-2 md:grid-cols-4">${kpi('Homepage visits',S.visits)}${kpi('Wizard starts',(S.starts.switch||0)+(S.starts.buyback||0),`Switch ${S.starts.switch||0} · Buyback ${S.starts.buyback||0}`)}${kpi('Inquiries completed',(S.done.switch||0)+(S.done.buyback||0),`Switch ${S.done.switch||0} · Buyback ${S.done.buyback||0}`)}${kpi('Visit → inquiry',pct((S.done.switch||0)+(S.done.buyback||0),S.visits),`Switch ${pct(S.done.switch||0,S.starts.switch)} · Buyback ${pct(S.done.buyback||0,S.starts.buyback)} of starts`)}</div>
 <div className="grid gap-6 lg:grid-cols-2">
  <div className="rounded-2xl border border-line bg-card p-5 min-w-0"><h2 className="font-bold mb-4">Switch wizard: steps reached</h2><${Funnel} f=${S.fs} labels=${['Firmware','Model','microSD','FAQs','Mail-in','Review']}/><p className="text-xs text-mute mt-3">Red % = drop-off from the previous step. Completed: ${S.done.switch||0}.</p></div>
  <div className="rounded-2xl border border-line bg-card p-5 min-w-0"><h2 className="font-bold mb-4">Buyback wizard: steps reached</h2><${Funnel} f=${S.fb} labels=${['Device','Model','Problem','Condition','Photos','Contact']}/><p className="text-xs text-mute mt-3">Completed: ${S.done.buyback||0}.</p></div>
  <div className="rounded-2xl border border-line bg-card p-5 min-w-0"><h2 className="font-bold mb-4">Service clicks</h2><${Bars} data=${S.clicks} labels=${{switch:'Switch mod',buyback:'Buyback'}}/><h2 className="font-bold mt-6 mb-4">Traffic sources</h2><${Bars} data=${S.src}/></div>
  <div className="rounded-2xl border border-line bg-card p-5 min-w-0"><h2 className="font-bold mb-4">Switch models picked</h2><${Bars} data=${S.models} labels=${{v1:'Original',lite:'Lite',oled:'OLED'}}/><h2 className="font-bold mt-6 mb-4">microSD sizes picked</h2><${Bars} data=${Object.fromEntries(Object.entries(S.gb).map(([k,v])=>[k+'GB',v]))}/></div></div>
 ${mode==='local'?html`<div>${clr?html`<span className="text-sm mr-3">Delete local interaction log?</span><${Btn} kind="out" onClick=${()=>{LS.del('fi_events');setClr(false);location.reload()}}>Yes, clear<//> <${Btn} kind="ghost" onClick=${()=>setClr(false)}>Cancel<//>`:html`<${Btn} kind="out" onClick=${()=>setClr(true)}>Clear this browser's data<//>`}</div>`:null}

 <div className="border-t border-line pt-10"><${Eyebrow}>Business config<//><h2 className="text-3xl font-extrabold">Prices, terms and availability</h2><p className="text-mute mt-2">Changes apply instantly and are saved in this browser only. For the live site, copy the JSON below into the config file before deploying.</p>
  <div className="grid gap-6 md:grid-cols-2 mt-6">
   <div className="rounded-2xl border border-line bg-card p-5 flex flex-col gap-3"><h3 className="font-bold">Installation prices</h3>${cfg.models.map((m,i)=>numIn('p-'+m.id,m.name,['models',i,'price'],m.price))}<h3 className="font-bold mt-3">microSD prices</h3>${cfg.cards.map((c,i)=>numIn('c-'+c.gb,c.gb+'GB card',['cards',i,'price'],c.price))}${numIn('fee','Existing card setup fee',['existingCardFee'],cfg.existingCardFee)}${numIn('ship','Return shipping charge',['returnShipping'],cfg.returnShipping)}</div>
   <div className="rounded-2xl border border-line bg-card p-5 flex flex-col gap-4">
    <label className="flex items-start gap-3"><input id="svc-on" type="checkbox" className="mt-1 h-5 w-5" checked=${cfg.serviceEnabled} onChange=${e=>set(['serviceEnabled'],e.target.checked)}/><span><strong>Service available</strong><br/><span className="text-sm text-mute">Leave off until legal and operational review is done. Off shows the preview banner on every page.</span></span></label>
    <label className="flex items-start gap-3"><input id="pay-on" type="checkbox" className="mt-1 h-5 w-5" checked=${cfg.payments.live} onChange=${e=>set(['payments','live'],e.target.checked)}/><span><strong>Payments live</strong><br/><span className="text-sm text-mute">Only after the processor (${cfg.payments.processor}) confirms console modding is allowed, and your business registration, seller's permit and Business account are in place.</span></span></label>
    <${Field} id="cfg-turn" label="Turnaround text" req value=${cfg.turnaround} onInput=${e=>set(['turnaround'],e.target.value)}/>

    <${Field} id="cfg-fb" label="Facebook Marketplace profile URL" req value=${cfg.business.fbUrl} onInput=${e=>set(['business','fbUrl'],e.target.value)}/></div></div>
  <details className="rounded-2xl border border-line bg-card p-5 mt-6"><summary className="font-semibold flex justify-between">Advanced: edit everything (policies, FAQs, models) as JSON <span className="chev text-mute">▾</span></summary><textarea id="cfg-json" value=${draft} onInput=${e=>setDraft(e.target.value)} className="mt-4 w-full min-h-[320px] rounded-xl border border-line bg-sunk p-3 font-mono text-xs" spellCheck="false"></textarea><div className="flex flex-wrap items-center gap-3 mt-3"><${Btn} onClick=${()=>{try{setCfg(JSON.parse(draft));setMsg('Saved.')}catch(e){setMsg('That JSON has an error: '+e.message)}}}>Apply JSON<//><${Btn} kind="out" onClick=${()=>{setCfg(DEFAULT_CONFIG);setDraft(JSON.stringify(DEFAULT_CONFIG,null,2));setMsg('Reset to defaults.')}}>Reset defaults<//><${Copy} text=${draft}/><span className="text-sm text-mute" role="status">${msg}</span></div></details></div>

 <div className="rounded-2xl bg-sunk p-6"><h2 className="text-xl font-bold">Connecting real analytics (Cloudflare Pages)</h2><ol className="list-decimal pl-5 text-mute mt-2 flex flex-col gap-1 max-w-[70ch]"><li>Turn on Cloudflare Web Analytics for the Pages project. It counts visits and referrers with no cookies.</li><li>Cloudflare's beacon doesn't record custom events, so wizard steps need a tiny Pages Function (plus D1 or Workers Analytics Engine), or a free self-hosted tool like Umami. Set <code className="font-mono">window.FI_SEND = (name, props) =&gt; …</code> to forward events.</li><li>Point the inquiry forms at a Pages Function that emails you. Payments and shipping labels stay out of this site until reviewed.</li></ol></div></div>`}

/* ===== App shell ===== */
const NAV=[['switch','Switch mods'],['buyback','Sell a console'],['shipping','Shipping'],['about','About'],['contact','Contact']];
const TITLES={home:"Flippin' Isaac · Switch mods & broken console buyback",switch:"Switch modification inquiry · Flippin' Isaac",buyback:"Sell your broken console · Flippin' Isaac",about:"About · Flippin' Isaac",contact:"Contact · Flippin' Isaac",shipping:"Shipping · Flippin' Isaac",privacy:"Privacy Policy · Flippin' Isaac",terms:"Terms of Service · Flippin' Isaac",admin:"Owner dashboard · Flippin' Isaac"};
function App(){
 const get=()=>{const h=location.hash.slice(1);return TITLES[h]?h:'home'};
 const [view,setView]=useState(get);const [cfg,setCfgS]=useState(()=>({...DEFAULT_CONFIG,...LS.get('fi_cfg',{})}));const [menu,setMenu]=useState(false);
 const [theme,setTheme]=useState(()=>LS.get('fi_theme',null));
 const setCfg=c=>{setCfgS(c);LS.set('fi_cfg',c)};
 useEffect(()=>{const f=()=>{setView(get());setMenu(false);window.scrollTo(0,0)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
 useEffect(()=>{document.title=TITLES[view];if(view!=='admin')track('page_view',{view,src:SRC})},[view]);
 useEffect(()=>{const r=document.documentElement;theme?r.setAttribute('data-theme',theme):r.removeAttribute('data-theme');LS.set('fi_theme',theme)},[theme]);
 const isDark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
 const page={home:html`<${Home} cfg=${cfg}/>`,switch:html`<${SwitchWizard} cfg=${cfg}/>`,buyback:html`<${BuybackWizard} cfg=${cfg}/>`,about:html`<${About} cfg=${cfg}/>`,contact:html`<${ContactPage} cfg=${cfg}/>`,shipping:html`<${ShippingPage} cfg=${cfg}/>`,privacy:html`<${Legal} title="Privacy Policy" items=${PRIVACY}/>`,terms:html`<${Legal} title="Terms of Service" items=${TERMS}/>`,admin:html`<${Admin} cfg=${cfg} setCfg=${setCfg}/>`}[view];
 const wiz=view==='switch'||view==='buyback';
 return html`<div className="min-h-screen flex flex-col">
 <header className="sticky z-50 border-b border-line bg-card" style=${{top:'env(safe-area-inset-top,0px)'}}><div className="gut max-w-6xl mx-auto h-16 flex items-center justify-between gap-4">
  <a href="#home" className="font-display text-xl font-extrabold tracking-tight" style=${{fontStretch:'80%'}}>Flippin'<span className="text-acc"> Isaac</span></a>
  <nav className="hidden md:flex items-center gap-1" aria-label="Main">${NAV.map(([h,l])=>html`<a key=${h} href=${'#'+h} className=${'rounded-full px-4 py-2 text-sm font-semibold '+(view===h?'bg-sunk':'text-mute hover:text-ink')}>${l}</a>`)}</nav>
  <div className="flex items-center gap-1"><a href="#switch" onClick=${()=>track('service_click',{service:'switch',from:'header'})} className="hidden sm:inline-flex items-center rounded-full bg-acc text-accink px-4 h-10 text-sm font-semibold mr-1 hover:brightness-110">Get Started</a><button type="button" aria-label=${isDark?'Switch to light mode':'Switch to dark mode'} onClick=${()=>setTheme(isDark?'light':'dark')} className="h-11 w-11 rounded-full grid place-items-center hover:bg-sunk text-lg">${isDark?'☀':'☾'}</button><button type="button" className="md:hidden h-11 px-4 rounded-full border border-line font-semibold text-sm" aria-expanded=${menu} aria-controls="mnav" onClick=${()=>setMenu(!menu)}>${menu?'Close':'Menu'}</button></div></div>
  ${menu?html`<nav id="mnav" className="md:hidden gut border-t border-line py-3 flex flex-col" aria-label="Mobile">${NAV.map(([h,l])=>html`<a key=${h} href=${'#'+h} className="py-3 font-semibold border-b border-line last:border-0">${l}</a>`)}</nav>`:null}</header>
 ${!cfg.serviceEnabled?html`<div className="bg-warnsoft text-warn text-sm"><p className="gut max-w-6xl mx-auto py-2.5 font-medium">Not taking new orders right now. Check back soon.</p></div>`:null}
 <main className="flex-1">${page}</main>
 ${!wiz?html`<footer className="border-t border-line"><div className="gut max-w-6xl mx-auto py-8 flex flex-wrap items-center justify-between gap-4 text-sm text-mute"><p>© ${new Date().getFullYear()} Flippin' Isaac · ${cfg.business.area}. Not affiliated with Nintendo, Sony or Microsoft.</p><nav className="flex flex-wrap gap-4" aria-label="Footer"><a href="#privacy" className="hover:text-ink">Privacy</a><a href="#terms" className="hover:text-ink">Terms</a><a href="#contact" className="hover:text-ink">Contact</a><a href="#admin" className="hover:text-ink">Owner dashboard</a></nav></div></footer>`:null}
 </div>`}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
</script>
